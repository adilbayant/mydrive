<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Akses Dokumen</title>
    <style>
        /* Reset Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container Utama */
        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        /* Ikon Google Drive */
        .icon-container {
            width: 80px;
            height: 80px;
            background-color: #e8f0fe;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
        }

        .icon-container svg {
            width: 40px;
            height: 40px;
            fill: #1a73e8;
        }

        /* Tipografi */
        h1 {
            color: #202124;
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p {
            color: #5f6368;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* Desain Tombol */
        .btn-primary {
            display: inline-block;
            background-color: #1a73e8;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(26, 115, 232, 0.2);
            transition: background-color 0.2s, box-shadow 0.2s, transform 0.1s;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: #1557b0;
            box-shadow: 0 6px 12px rgba(26, 115, 232, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Footer Kecil */
        .footer-text {
            margin-top: 24px;
            font-size: 12px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bagian Ikon Ilustrasi -->
        <div class="icon-container">
            <svg viewBox="0 0 24 24">
                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
            </svg>
        </div>

        <!-- Judul & Deskripsi -->
        <h1>Akses Folder Dokumen</h1>
        <p>Silakan klik tombol di bawah ini untuk membuka dan mengunduh berkas yang Anda butuhkan langsung melalui Google Drive resmi.</p>

        <!-- Tombol Menuju Link -->
        <a href="https://drive.google.com/drive/folders/1xkAS2toNUuPfaL3YF2tmP8ufMKV3gfsy?usp=sharing" target="_blank" class="btn-primary">
            Buka Folder Google Drive
        </a>

        <!-- Catatan Kaki -->
        <div class="footer-text">
            Tautan akan terbuka di tab baru dengan aman.
        </div>
    </div>

</body>
</html>
